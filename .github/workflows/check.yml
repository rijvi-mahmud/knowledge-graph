name: Check

# Validates every spec, the types and the generated OpenAPI files on each pull
# request and push to main, so a broken id, a dash or an invalid OpenAPI file
# never reaches production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check specs
        run: pnpm check:specs --strict
      # The build generates .source through the fumadocs-mdx Next.js plugin.
      # Run it before the type check: the standalone fumadocs-mdx command
      # wrote empty files on GitHub's runners.
      - name: Build
        run: pnpm build
      - name: Check types
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - name: Show generated sources if a step fails
        if: failure()
        run: |
          node -v; pnpm -v
          ls -la .source
      - name: Lint the generated OpenAPI files
        run: |
          find .next/server/app/openapi -name '*.json.body' -exec sh -c 'cp "$1" "${1%.body}"' _ {} \;
          find .next/server/app/openapi -name '*.json' -exec npx -y @redocly/cli@2 lint --extends=minimal {} +
